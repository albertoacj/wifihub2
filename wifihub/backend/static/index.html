/* ---------- consumo de dados ---------- */
function fmtBytes(b){
  if(!b||b<1) return ["0"," B"];
  const u=["B","KB","MB","GB","TB"]; let i=0,v=b;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return [v>=100?v.toFixed(0):v.toFixed(1)," "+u[i]];
}

function UsageBars({down,up}){
  const n=Math.max(down.length,up.length);
  if(!n) return html`<div class="ubars"></div>`;
  const mx=Math.max(...down,...up,1);
  return html`<div class="ubars">
    ${Array.from({length:n}).map((_,i)=>{
      const d=down[i]||0, u=up[i]||0, tot=d+u;
      const h=Math.max(2,Math.round((tot/mx)*34));
      return html`<i key=${i} style=${`height:${h}px`}
        title=${fmtBytes(tot).join("")}></i>`;
    })}
  </div>`;
}


function fmtAgo(ts){
  if(!ts) return "nunca visto";
  const d=Math.floor(Date.now()/1000)-ts;
  if(d<90) return "agora há pouco";
  if(d<3600) return `há ${Math.floor(d/60)} min`;
  if(d<86400) return `há ${Math.floor(d/3600)}h`;
  const dias=Math.floor(d/86400);
  return dias===1? "ontem" : `há ${dias} dias`;
}
function fmtUptime(sec){
  if(!sec) return "—";
  const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60);
  return d? `${d}d ${h}h` : h? `${h}h ${m}min` : `${m}min`;
}
function GaugeCell({label,value,suffix,sub,pct,small,onClick}){
  const p=Math.max(0,Math.min(100,pct??0));
  const cls = p>=85?"hot" : p>=65?"warn" : "";
  return html`<div class=${"gcell"+(onClick?" click":"")} onClick=${onClick}
      title=${onClick?"ver histórico":null}>
    <div class="gl">${label}</div>
    <div class=${"gv"+(String(value).length>9?" ip":"")}>${value}${suffix?html`<span style="font-size:12px;color:var(--muted)"> ${suffix}</span>`:null}</div>
    ${sub?html`<div class="gs">${sub}</div>`:null}
    ${pct!=null?html`<div class="gbar"><i class=${cls} style=${`width:${p}%`}></i></div>`:null}
  </div>`;
}
function GatewayHealth({h,name,host,onPick}){
  if(!h) return null;
  const mb = b => b? (b/1048576).toFixed(0)+" MB" : "";
  const pick = m => (host&&onPick)? (()=>onPick(m)) : null;
  return html`<div class="ghealth">
    ${h.cpu!=null? html`<${GaugeCell} label="CPU" value=${h.cpu} suffix="%"
        sub=${h.load!=null?`carga ${h.load.toFixed(2)}`:null} pct=${h.cpu} onClick=${pick("cpu")}/>`:null}
    ${h.npu!=null? html`<${GaugeCell} label="NPU" value=${h.npu} suffix="%"
        sub="aceleração NSS" pct=${h.npu} onClick=${pick("npu")}/>`:null}
    ${h.mem!=null? html`<${GaugeCell} label="Memória" value=${h.mem} suffix="%"
        sub=${mb(h.mem_used)+" de "+mb(h.mem_total)} pct=${h.mem} onClick=${pick("mem")}/>`:null}
    ${h.temp!=null? html`<${GaugeCell} label="Temperatura" value=${h.temp} suffix="°C"
        sub=${name||"gateway"} pct=${Math.round((h.temp/95)*100)} onClick=${pick("temp")}/>`:null}
    ${h.uptime!=null? html`<${GaugeCell} label="No ar" value=${fmtUptime(h.uptime)} sub="sem reiniciar"/>`:null}
    ${h.wan_ip? html`<${GaugeCell} label="IP WAN" value=${h.wan_ip} sub="endereço público"/>`:null}
  </div>`;
}


function UsageZoom({dev,period}){
  const D=dev.dseries||[], U=dev.useries||[];
  const n=Math.max(D.length,U.length);
  const mx=Math.max(...D,...U,1);
  const unit={day:"por hora",week:"por dia",month:"por dia",year:"por mês"}[period]||"";
  return html`<div class="uzoom">
    <div class="zh">
      <span class="zt">${dev.name}</span>
      <span class="zl">${unit}${dev.ip?" · "+dev.ip:""}${dev.where?" · "+dev.where:""}</span>
    </div>
    <div class="zbars">
      ${Array.from({length:n}).map((_,i)=>{
        const d=D[i]||0, u=U[i]||0;
        const hd=Math.round((d/mx)*70), hu=Math.round((u/mx)*46);
        return html`<div class="zcol" key=${i}
          title=${`↓ ${fmtBytes(d).join("")}  ↑ ${fmtBytes(u).join("")}`}>
          <i class="d" style=${`height:${Math.max(1,hd)}px`}></i>
          <i class="u" style=${`height:${Math.max(1,hu)}px`}></i>
        </div>`;
      })}
    </div>
    <div class="zleg">
      <span class="dl">↓ download <b>${fmtBytes(dev.down).join("")}</b></span>
      <span class="ul">↑ upload <b>${fmtBytes(dev.up).join("")}</b></span>
      <span class="muted">total <b>${fmtBytes(dev.total).join("")}</b></span>
    </div>
  </div>`;
}

function Usage({meta,toast}){
  const [period,setPeriod]=useState("day");
  const [data,setData]=useState(null);
  const [open,setOpen]=useState(null);
  useEffect(()=>{ let ok=true; setData(null);
    api(`/api/usage?period=${period}`).then(d=>{ if(ok)setData(d); })
      .catch(()=>setData({devices:[]}));
    return ()=>{ok=false;}; },[period]);

  const labels={day:"24 horas",week:"7 dias",month:"30 dias",year:"1 ano"};
  const devs=data?.devices||[];
  const totD=devs.reduce((a,d)=>a+d.down,0), totU=devs.reduce((a,d)=>a+d.up,0);

  return html`<div>
    <div class="useg">
      ${["day","week","month","year"].map(p=>html`<button key=${p} class=${p===period?"on":""}
        onClick=${()=>setPeriod(p)}>${labels[p]}</button>`)}
    </div>
    <div class="utot">
      <div class="b"><div class="l">Download</div>
        <div class="v dl">${fmtBytes(totD).join("")}</div></div>
      <div class="b"><div class="l">Upload</div>
        <div class="v ul">${fmtBytes(totU).join("")}</div></div>
      <div class="b"><div class="l">Total</div>
        <div class="v">${fmtBytes(totD+totU).join("")}</div></div>
      <div class="b"><div class="l">Dispositivos</div>
        <div class="v">${devs.length}</div></div>
    </div>
    <div class="card">
      ${data===null? html`<div class="empty">carregando consumo…</div>`
        : devs.length? devs.map(d=>html`
          <div key=${d.mac}>
            <div class="urow" onClick=${()=>setOpen(o=>o===d.mac?null:d.mac)}>
              <div class="ic" style=${toneVars(d.icon)}><${Icon} k=${d.icon}/></div>
              <div class="uinfo">
                <div class="n">${d.name}</div>
                <div class="w">${d.where||"—"}${d.ip?" · "+d.ip:""}</div>
              </div>
              <div class="uvals">
                <div class="t">${fmtBytes(d.total).join("")}</div>
                <div class="dl">↓ ${fmtBytes(d.down).join("")}</div>
                <div class="ul">↑ ${fmtBytes(d.up).join("")}</div>
              </div>
              <${UsageBars} down=${d.dseries||[]} up=${d.useries||[]}/>
            </div>
            ${open===d.mac && html`<${UsageZoom} dev=${d} period=${period}/>`}
          </div>`)
        : html`<div class="empty">sem dados no período — o histórico começa a partir da primeira coleta</div>`}
    </div>
  </div>`;
}

function TrafficRules(){

/* ---------- regras de firewall (VLAN a VLAN) ---------- */
function Firewall({toast}){
  const [fw,setFw]=useState(null);
  const [busy,setBusy]=useState(false);
  const blank={name:"",src:"",dest:"",target:"ACCEPT",src_ip:"",dest_ip:"",proto:"",dest_port:""};
  const [f,setF]=useState(blank);
  const load=()=>api("/api/firewall").then(d=>{ setFw(d);
    setF(x=>x.src?x:{...x,src:d.zones[0]?.name||"",dest:d.zones[1]?.name||d.zones[0]?.name||""});
  }).catch(()=>setFw({zones:[],forwardings:[],rules:[]}));
  useEffect(()=>{load();},[]);

  const create=async()=>{
    if(!f.src||!f.dest) return;
    setBusy(true);
    try{
      await api("/api/rules",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify(f)});
      toast("Regra criada e aplicada","var(--signal)");
      setF({...blank,src:f.src,dest:f.dest}); load();
    }catch(e){ toast("Falha ao criar regra","var(--alert)"); }
    setBusy(false);
  };
  const del=async(r)=>{
    if(!confirm(`Apagar a regra "${r.name}"?\n\n${r.src} → ${r.dest} · ${r.target}\nIsto altera o firewall do gateway imediatamente.`)) return;
    setBusy(true);
    try{ await api(`/api/rules/${r.id}`,{method:"DELETE"}); toast("Regra removida"); load(); }
    catch(e){ toast("Falha ao remover","var(--alert)"); }
    setBusy(false);
  };

  if(fw===null) return html`<div class="empty">carregando firewall…</div>`;
  const zn=(fw.zones||[]).map(z=>z.name);

  return html`<div>
    <div class="secth"><h3>Zonas</h3><span>cada zona é uma VLAN/rede do gateway</span></div>
    <div class="zones">
      ${(fw.zones||[]).map(z=>html`<div class="zbox" key=${z.id}>
        <div class="zn">${z.name}</div>
        <div class="zd">${(z.networks||[]).join(", ")||"—"} · fwd ${z.forward}</div>
      </div>`)}
    </div>

    <div class="secth"><h3>Encaminhamentos</h3>
      <span>liberam a zona inteira para a outra</span></div>
    <div class="fwdlist">
      ${(fw.forwardings||[]).length? fw.forwardings.map(x=>html`
        <span class="fwdchip" key=${x.id}>${x.src} <b>→</b> ${x.dest}</span>`)
        : html`<span class="muted" style="font-size:12.5px">nenhum encaminhamento entre zonas</span>`}
    </div>

    <div class="secth"><h3>Regras</h3><span>controle fino entre VLANs</span></div>
    <div class="card">
      ${(fw.rules||[]).length? fw.rules.map(r=>html`<div class="trow" key=${r.id}>
          <div>
            <div class="tn">${r.name}</div>
            <div class="tp">
              ${r.src_name||r.src_ip||"toda a zona"} → ${r.dest_name||r.dest_ip||"toda a zona"}
              ${r.proto&&r.proto!=="all"?" · "+r.proto:""}${r.dest_port?" :"+r.dest_port:""}
            </div>
          </div>
          <span class="zchip">${r.src} → ${r.dest}</span>
          <div class="rowacts">
            <span class=${"tgt "+r.target}>${r.target}</span>
            <button class="iconbtn del" title="Remover" onClick=${()=>del(r)}>×</button>
          </div>
        </div>`)
        : html`<div class="empty">nenhuma regra entre zonas</div>`}

      <div class="rulegrid">
        <span class="rl">Nova regra entre VLANs</span>
        <input class="f" placeholder="nome da regra" value=${f.name}
          onInput=${e=>setF({...f,name:e.target.value})}/>
        <select value=${f.src} onChange=${e=>setF({...f,src:e.target.value})}>
          ${zn.map(z=>html`<option key=${z} value=${z}>de ${z}</option>`)}
        </select>
        <select value=${f.dest} onChange=${e=>setF({...f,dest:e.target.value})}>
          ${zn.map(z=>html`<option key=${z} value=${z}>para ${z}</option>`)}
        </select>
        <input class="f" placeholder="IP destino (opcional)" value=${f.dest_ip}
          onInput=${e=>setF({...f,dest_ip:e.target.value})}/>
        <select value=${f.target} onChange=${e=>setF({...f,target:e.target.value})}>
          <option value="ACCEPT">permitir</option>
          <option value="REJECT">rejeitar</option>
          <option value="DROP">descartar</option>
        </select>
        <button class="btn" disabled=${busy||!f.src||!f.dest} onClick=${create}>Criar</button>
        <input class="f" placeholder="IP origem (opcional)" value=${f.src_ip}
          onInput=${e=>setF({...f,src_ip:e.target.value})}/>
        <select value=${f.proto} onChange=${e=>setF({...f,proto:e.target.value})}>
          <option value="">todos os protocolos</option>
          <option value="tcp">TCP</option><option value="udp">UDP</option>
          <option value="tcp udp">TCP+UDP</option><option value="icmp">ICMP</option>
        </select>
        <input class="f" placeholder="porta destino (opcional)" value=${f.dest_port}
          onInput=${e=>setF({...f,dest_port:e.target.value})}/>
      </div>
    </div>
  </div>`;
}

function Redirects({toast}){
  const [rules,setRules]=useState(null);
  const [busy,setBusy]=useState(false);
  const [editId,setEditId]=useState(null);
  const blank={proto:"tcp",src_dport:"",dest_ip:"",dest_port:"",name:""};
  const load=()=>api("/api/redirects").then(setRules).catch(()=>setRules([]));
  useEffect(()=>{load();},[]);

  const create=async(f)=>{ setBusy(true);
    try{ await api("/api/redirects",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(f)}); toast("Regra criada e aplicada","var(--signal)"); load();
    }catch(e){ toast("Falha ao criar regra","var(--alert)"); } setBusy(false); };
  const save=async(id,f)=>{ setBusy(true);
    try{ await api(`/api/redirects/${id}`,{method:"PUT",headers:{"content-type":"application/json"},
      body:JSON.stringify(f)}); toast("Regra atualizada","var(--signal)"); setEditId(null); load();
    }catch(e){ toast("Falha ao atualizar","var(--alert)"); } setBusy(false); };
  const del=async(id,label)=>{
    if(!confirm(`Apagar a regra "${label||id}"?\n\nIsto altera o firewall do gateway imediatamente.`)) return;
    setBusy(true);
    try{ await api(`/api/redirects/${id}`,{method:"DELETE"}); toast("Regra removida"); load(); }
    catch(e){ toast("Falha ao remover","var(--alert)"); } setBusy(false); };

  return html`<div>
  <div class="card">
    <div class="fwhead"><span>Proto</span><span>Externa</span>
      <span>Destino</span><span>Interna</span><span></span></div>

    ${rules===null? html`<div class="empty">carregando regras…</div>`
      : rules.length? rules.map(x=> editId===x.id
        ? html`<div class="fwrow" key=${x.id}><div class="fwedit">
            <${RuleForm} busy=${busy}
              init=${{proto:x.proto,src_dport:x.src_dport,dest_ip:x.dest_ip,dest_port:x.dest_port,name:x.name}}
              onSave=${f=>save(x.id,f)} onCancel=${()=>setEditId(null)}/>
          </div></div>`
        : html`<div class="fwrow" key=${x.id}>
            <span class=${"proto "+x.proto.replace(" ","")}>${x.proto}</span>
            <span class="mono extcol">${x.src_dport}</span>
            <div class="dcell">
              <div class="dname">${x.dest_name||x.name||"—"}</div>
              <div class="dip">${x.dest_ip} · porta ${x.src_dport}→${x.dest_port}</div>
            </div>
            <span class="mono intcol">${x.dest_port}</span>
            <div class="rowacts">
              <button class="iconbtn" title="Editar" onClick=${()=>setEditId(x.id)}>✎</button>
              <button class="iconbtn del" title="Remover" onClick=${()=>del(x.id,x.dest_name||x.name)}>×</button>
            </div>
          </div>`)
      : html`<div class="empty">nenhuma regra de redirecionamento no gateway</div>`}

    <div class="fwadd">
      <span class="addlbl">Nova regra</span>
      <${RuleForm} init=${blank} onSave=${create} busy=${busy}/>
    </div>
  </div>
  </div>`;
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rede Casa Cabral</title>
<meta name="theme-color" content="#20242A">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#20242A; --panel:#2A2F36; --panel2:#333941; --line:#414954;
  --ink:#FFFFFF; --muted:#B4BDC8; --muted2:#8C97A4;
  --down:#3DDC77; --alert:#FF6B6B;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Space Grotesk",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--sans);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.box{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin-bottom:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--down);
  box-shadow:0 0 12px var(--down)}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:7px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:15px;border-radius:10px;padding:12px 13px}
input:focus{outline:none;border-color:var(--down)}
button{width:100%;margin-top:14px;background:var(--down);color:#04231d;border:none;
  font-weight:700;font-size:15px;border-radius:10px;padding:13px;font-family:var(--sans)}
button:disabled{opacity:.6}
.err{margin-top:12px;font-size:13px;color:var(--alert);min-height:18px}
.hint{margin-top:16px;font-size:12px;color:var(--muted2);line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="dot"></span>Rede Casa Cabral</div>
  <form id="f">
    <label for="p">Senha do painel</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Entrar</button>
    <div class="err" id="e"></div>
  </form>
  <div class="hint">A sessão fica ativa por 90 dias neste aparelho.</div>
</div>
<script>
const f=document.getElementById("f"), p=document.getElementById("p"),
      e=document.getElementById("e"), b=document.getElementById("b");
f.addEventListener("submit", async (ev)=>{
  ev.preventDefault(); e.textContent=""; b.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({password:p.value})});
    if(r.ok){ location.href="/"; return; }
    const d=await r.json().catch(()=>({}));
    e.textContent=d.detail||"Senha incorreta";
  }catch(err){ e.textContent="Falha de conexão"; }
  b.disabled=false; p.select();
});
</script>
</body>
</html>
